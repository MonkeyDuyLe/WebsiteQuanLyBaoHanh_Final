<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - TechCare Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-logo">
            <span class="logo-icon">🔑</span>
            <h1>Quên mật khẩu?</h1>
            <p>Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu an toàn</p>
        </div>

        <form id="forgotForm" class="auth-form" onsubmit="handleForgotSubmit(event)">
            <div class="form-group">
                <label for="forgotEmail"><i class="fas fa-envelope"></i> Email của bạn</label>
                <input type="email" id="forgotEmail" placeholder="vd: email@gmail.com" required>
            </div>

            <button type="submit" id="btnForgot" class="btn-primary">
                <i class="fas fa-paper-plane"></i> Gửi link khôi phục
            </button>
        </form>

        <div class="auth-links">
            <p>Nhớ mật khẩu rồi? <a href="index.html"><strong>Quay lại đăng nhập</strong></a></p>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        async function handleForgotSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('btnForgot');

            if (!email) return;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi email...';
                await resetPassword(email);
                showToast('Đã gửi email khôi phục mật khẩu. Vui lòng kiểm tra hòm thư của bạn!', 'success', 5000);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 4000);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Gửi link khôi phục';
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
